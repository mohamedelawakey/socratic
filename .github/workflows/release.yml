name: Automated Semantic Release & Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-release:
    name: Automatic Semantic Release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci')"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Determine Next Semantic Version
        id: semver
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "(MAJOR|BREAKING)"
          minor_pattern: "(feat|feature)"
          version_format: "${major}.${minor}.${patch}"
          bump_each_commit: false

      - name: Display New Version
        run: |
          echo "🚀 Computed Next Version: ${{ steps.semver.outputs.version }}"
          echo "TAG_NAME=v${{ steps.semver.outputs.version }}" >> $GITHUB_ENV
          echo "VERSION=${{ steps.semver.outputs.version }}" >> $GITHUB_ENV

      - name: Install Build & Packaging Tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Inject Dynamic Version into Package Build
        run: |
          # Dynamically inject the calculated version without manually editing pyproject.toml
          python3 -c "
          import re
          version = '${{ env.VERSION }}'
          with open('pyproject.toml', 'r', encoding='utf-8') as f:
              content = f.read()
          content = re.sub(r'version\s*=\s*\"[^\"]+\"', f'version = \"{version}\"', content)
          with open('pyproject.toml', 'w', encoding='utf-8') as f:
              f.write(content)
          "
          python -m build

      - name: Validate Package Artifacts
        run: |
          twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
